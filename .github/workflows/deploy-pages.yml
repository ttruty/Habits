name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Scoring must stay at 100% coverage (thresholds in vite.config.ts).
      - run: npm run test:coverage

      # Base path defaults to /Habits/. For a custom domain at the root, set the repository
      # variable PAGES_BASE to "/" (Settings → Secrets and variables → Actions → Variables).
      # SUPABASE_URL and SUPABASE_ANON_KEY (repository variables, not secrets: both are public by
      # design and RLS protects the data). Missing = the site runs on demo data.
      - run: npm run build
        env:
          PAGES_BASE: ${{ vars.PAGES_BASE || '/Habits/' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # Embed budget: dist/embed.js must stay under 25 KB gzipped.
      - run: npm run size

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
